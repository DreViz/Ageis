services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ageis
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: mock_identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ageis -d mock_identity"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mock_data:/var/lib/postgresql/data
  mock-identity:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ageis:local-demo-only@db:5432/mock_identity
      ENABLE_TEST_FAULTS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  mock-notice:
    build: .
    command: ["uvicorn", "mock_notice.app:create_env_app", "--factory", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      DATABASE_URL: postgresql+psycopg://ageis:local-demo-only@db:5432/mock_identity
      ENABLE_TEST_FAULTS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  runtime-api:
    build: .
    command: ["uvicorn", "runtime.api:create_env_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      RUNTIME_DATABASE_URL: postgresql+psycopg://ageis:local-demo-only@db:5432/mock_identity
      OPERATOR_TOKEN: local-demo-only-token
      AGEIS_MODEL_ID: ${AGEIS_MODEL_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build: .
    command: ["python", "-m", "runtime.worker"]
    environment:
      RUNTIME_DATABASE_URL: postgresql+psycopg://ageis:local-demo-only@db:5432/mock_identity
      MOCK_IDENTITY_URL: http://mock-identity:8000
      MOCK_NOTICE_URL: http://mock-notice:8002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      mock-identity:
        condition: service_started
      runtime-api:
        condition: service_healthy
      mock-notice:
        condition: service_healthy
volumes:
  mock_data:
